server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger_db}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

processor:
  base-url: ${PROCESSOR_BASE_URL:http://localhost:8081}
fx:
  base-url: ${FX_SERVICE_URL:http://localhost:8083}
  clearing-accounts:
    USD: ${FX_CLEARING_ACCOUNT_USD:fx-clearing-USD}
    EUR: ${FX_CLEARING_ACCOUNT_EUR:fx-clearing-EUR}
    GBP: ${FX_CLEARING_ACCOUNT_GBP:fx-clearing-GBP}
  transfer-sweep:
    interval-ms: ${FX_TRANSFER_SWEEP_INTERVAL_MS:15000}
    stuck-threshold-ms: ${FX_TRANSFER_STUCK_THRESHOLD_MS:30000}
reconciliation:
  interval-ms: ${RECONCILIATION_INTERVAL_MS:300000}
holds:
  base-url: ${HOLDS_SERVICE_URL:http://localhost:8082}
  held-balance-timeout-ms: ${HOLDS_HELD_BALANCE_TIMEOUT_MS:2000}
