server:
  port: 8082

spring:
  application:
    name: holds-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:holds_db}
    username: ${DB_USER:holds}
    password: ${DB_PASSWORD:holds}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
