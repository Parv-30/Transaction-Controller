services:
  ledger-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
      - ./ledger-postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  processor-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: processor_db
      POSTGRES_USER: processor
      POSTGRES_PASSWORD: processor
    volumes:
      - processor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processor -d processor_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "8474:8474"   # control API
      - "15432:15432" # ledger-postgres app connection proxy
      - "15433:15433" # ledger-postgres CDC connection proxy
      - "15674:15674" # rabbitmq proxy (distinct host port -- rabbitmq itself already binds 5672/15672)
      - "15675:15675" # gateway-simulator's own rabbitmq connection proxy (chaos scenario 9)
    depends_on:
      ledger-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ledger-service:
    build:
      context: .
      dockerfile: ledger-service/Dockerfile
    environment:
      DB_HOST: toxiproxy
      DB_PORT: "15432"
      DB_NAME: ledger_db
      DB_USER: ledger
      DB_PASSWORD: ledger
      PROCESSOR_BASE_URL: http://transaction-processor:8081
      SERVER_PORT: "8090"
      FX_SERVICE_URL: http://fx-service:8083
      HOLDS_SERVICE_URL: http://holds-service:8082
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/ledger
    ports:
      - "8090:8090"
    depends_on:
      ledger-postgres:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      fx-service:
        condition: service_started

  transaction-processor:
    build:
      context: .
      dockerfile: transaction-processor/Dockerfile
    environment:
      DB_HOST: processor-postgres
      DB_PORT: "5432"
      DB_NAME: processor_db
      DB_USER: processor
      DB_PASSWORD: processor
      RABBITMQ_HOST: toxiproxy
      RABBITMQ_PORT: "15674"
      CDC_DB_HOST: toxiproxy
      CDC_DB_PORT: "15433"
      CDC_DB_USER: debezium_replicator
      CDC_DB_PASSWORD: debezium_replicator
      CDC_DB_NAME: ledger_db
      CDC_OFFSET_FILE: /var/lib/debezium/offsets/offsets.dat
    volumes:
      - debezium-offsets:/var/lib/debezium/offsets
    ports:
      - "8081:8081"
    depends_on:
      processor-postgres:
        condition: service_healthy
      ledger-service:
        condition: service_started
      toxiproxy:
        condition: service_started

  fx-db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: fx_db
      POSTGRES_USER: fx
      POSTGRES_PASSWORD: fx
    volumes:
      - fx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx -d fx_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  fx-service:
    build:
      context: .
      dockerfile: fx-service/Dockerfile
    environment:
      DB_HOST: fx-db
      DB_PORT: "5432"
      DB_NAME: fx_db
      DB_USER: fx
      DB_PASSWORD: fx
    ports:
      - "8083:8083"
    depends_on:
      fx-db:
        condition: service_healthy

  gateway-sim-db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: gateway_sim_db
      POSTGRES_USER: gatewaysim
      POSTGRES_PASSWORD: gatewaysim
    volumes:
      - gateway-sim-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatewaysim -d gateway_sim_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway-simulator:
    build:
      context: .
      dockerfile: gateway-simulator/Dockerfile
    environment:
      DB_HOST: gateway-sim-db
      DB_PORT: "5432"
      DB_NAME: gateway_sim_db
      DB_USER: gatewaysim
      DB_PASSWORD: gatewaysim
      RABBITMQ_HOST: toxiproxy
      RABBITMQ_PORT: "15675"
      LEDGER_SERVICE_URL: http://ledger-service:8090
    ports:
      - "8084:8084"
    depends_on:
      gateway-sim-db:
        condition: service_healthy
      toxiproxy:
        condition: service_started

  holds-db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: holds_db
      POSTGRES_USER: holds
      POSTGRES_PASSWORD: holds
    volumes:
      - holds-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holds -d holds_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  holds-service:
    build:
      context: .
      dockerfile: holds-service/Dockerfile
    environment:
      DB_HOST: holds-db
      DB_PORT: "5432"
      DB_NAME: holds_db
      DB_USER: holds
      DB_PASSWORD: holds
      LEDGER_SERVICE_URL: http://ledger-service:8090
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/ledger
    ports:
      - "8082:8082"
    depends_on:
      holds-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ledger-service:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Fixes the issuer claim to a single stable value (http://host.docker.internal:8180/realms/ledger)
      # regardless of which hostname/network path a client used to reach Keycloak. Without this,
      # Keycloak's dev-mode default (issuer derived from the request's own Host header) means a token
      # fetched by a host-side script hitting localhost:8180 carries a different "iss" claim than what
      # api-gateway (running inside the Docker network, validating via KEYCLOAK_ISSUER_URI) expects --
      # producing a silent 401 on every request even with a structurally valid token (confirmed by
      # reproduction). host.docker.internal is reachable both from the host (via the published 8180
      # port, through Docker Desktop's loopback) and from other containers, so both api-gateway and any
      # host-side curl/script resolve to the same issuer string.
      KC_HOSTNAME: host.docker.internal
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak-realm:/opt/keycloak/data/import
    ports:
      - "8180:8080"
    healthcheck:
      # The quay.io/keycloak/keycloak image ships neither curl nor wget, so the healthcheck
      # uses bash's /dev/tcp to issue a raw HTTP request instead (confirmed by reproduction:
      # a curl-based healthcheck fails with "executable file not found in $PATH", leaving the
      # container running but permanently "unhealthy" and blocking api-gateway's depends_on).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/ledger HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 'HTTP/1.1 200'"]
      interval: 10s
      timeout: 5s
      retries: 15

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      LEDGER_SERVICE_URL: http://ledger-service:8090
      HOLDS_SERVICE_URL: http://holds-service:8082
      FX_SERVICE_URL: http://fx-service:8083
      GATEWAY_SIMULATOR_URL: http://gateway-simulator:8084
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/ledger
    ports:
      - "8080:8080"
    depends_on:
      ledger-service:
        condition: service_started
      holds-service:
        condition: service_started
      fx-service:
        condition: service_started
      keycloak:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      ledger-service:
        condition: service_started
      transaction-processor:
        condition: service_started
      holds-service:
        condition: service_started
      api-gateway:
        condition: service_started
      fx-service:
        condition: service_started
      gateway-simulator:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  ledger-pgdata:
  processor-pgdata:
  debezium-offsets:
  holds-pgdata:
  fx-pgdata:
  gateway-sim-pgdata:
